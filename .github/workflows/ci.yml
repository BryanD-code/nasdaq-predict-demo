name: PySpark CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-y-calidad:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Le indicamos en qué carpeta trabajar
    - name: Instalar dependencias
      working-directory: ./ML_demo_Nasdaq
      run: |
        python -m pip install --upgrade pip
        pip install pytest python-dotenv loguru typer tqdm
        pip install -e .

    # Le indicamos en qué carpeta lanzar los tests
    - name: Ejecutar Pytest
      working-directory: ./ML_demo_Nasdaq
      run: |
        pytest tests/