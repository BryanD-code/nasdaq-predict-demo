[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nasdaq-demo"
version = "0.0.1"
description = "Entrenamiento de modelo para predecir el precio del nasdaq como practica para introducirme en las diferentes tegnologias de da"
authors = [
  { name = "bryandev" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["nasdaq-demo"]
include = ["pyproject.toml", "nasdaq-demo/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["nasdaq-demo"]
force-sort-within-sections = true

